version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
      python: 3.11
    commands:
      - pip install aws-sam-cli
      - npm install
  pre_build:
    commands:
      - echo "Downloading environment file from S3..."
      - aws s3 cp s3://buildxup-delopyment-stage/backend/.env .env

  build:
    commands:
      - sam build
      - sam package --s3-bucket buildxup-deployment-artifacts-12345 --output-template-file packaged.yaml

  post_build:
    commands:
      - sam deploy --template-file packaged.yaml --stack-name buildxup-backend-stage --capabilities CAPABILITY_IAM

artifacts:
  files:
    - packaged.yaml
