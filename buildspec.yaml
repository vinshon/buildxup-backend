version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo "Install phase started"
      - npm install -g esbuild

  build:
    commands:
      - echo "Build started on $(date)"

      - echo "Downloading .env from S3..."
      - aws s3 cp "s3://buildxup-delopyment-stage/backend/.env" .

      - echo "Exporting env variables..."
      - export $(cat .env | grep -v '^#' | xargs)

      - echo "Installing production-only dependencies..."
      - npm ci --omit=dev

      - echo "Generating Prisma client without engines..."
      - npx prisma generate

      - echo "Removing unnecessary Prisma binaries..."
      - rm -rf node_modules/.prisma/client/libquery_engine*
      - rm -rf node_modules/@prisma/engines

      - echo "Substituting env vars into SAM template..."
      - envsubst < template.yaml > template-processed.yaml

      - echo "Packaging SAM template..."
      - |
        sam package \
          --template-file template-processed.yaml \
          --s3-bucket "buildxup-delopyment-stage" \
          --s3-prefix "backend" \
          --output-template-file "artifact.yaml"

      - echo "Checking packaged artifact..."
      - ls -la artifact.yaml

      - echo "Build completed on $(date)"

artifacts:
  files:
    - template.yaml
    - template-processed.yaml
    - artifact.yaml
    - dist/**/*
