AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: BuildXup Backend API - Backup Template

Parameters:
  # Stage parameter with fixed default 'dev'
  Stage:
    Type: String
    Default: dev
    Description: stage
  DatabaseUrl:
    Type: String
    Default: ${DatabaseUrl}
    Description: Database connection URL
  JwtSecret:
    Type: String
    Default: ${JwtSecret}
    Description: JWT secret key
  JwtExpiration:
    Type: String
    Default: ${JwtExpiration}
    Description: JWT expiration time
  SendgridApiKey:
    Type: String
    Default: ${SendgridApiKey}
    Description: SendGrid API key
  RefreshTokenSecret:
    Type: String
    Default: ${RefreshTokenSecret}
    Description: Refresh token secret
  TokenExpire:
    Type: String
    Default: ${TokenExpire}
    Description: Token expiration time
  RefreshTokenExpire:
    Type: String
    Default: ${RefreshTokenExpire}
    Description: Refresh token expiration time
  TwilioAccountSID:
    Type: String
    Default: ${TwilioAccountSID}
    Description: Twilio Account SID
  TwilioAuthToken:
    Type: String
    Default: ${TwilioAuthToken}
    Description: Twilio Auth Token
  TwilioPhoneNumber:
    Type: String
    Default: ${TwilioPhoneNumber}
    Description: Twilio phone number
  FromEmail:
    Type: String
    Default: ${FromEmail}
    Description: From email address
  FromName:
    Type: String
    Default: ${FromName}
    Description: From name
  FrontendUrl:
    Type: String
    Default: ${FrontendUrl}
    Description: Frontend URL
  DatabaseHost:
    Type: String
    Default: ${DatabaseHost}
    Description: Database host
  DatabasePort:
    Type: String
    Default: ${DatabasePort}
    Description: Database port
  DatabaseUser:
    Type: String
    Default: ${DatabaseUser}
    Description: Database user
  DatabasePassword:
    Type: String
    Default: ${DatabasePassword}
    Description: Database password
  DatabaseName:
    Type: String
    Default: ${DatabaseName}
    Description: Database name
  DatabaseSchema:
    Type: String
    Default: ${DatabaseSchema}
    Description: Database schema
  TestEmail:
    Type: String
    Default: ${TestEmail}
    Description: Test email address
  DeploymentTimestamp:
    Type: String
    Default: ${DeploymentTimestamp}
    Description: Deployment timestamp for Lambda function updates

Globals:
  Function:
    Timeout: 100
    MemorySize: 2048
    Environment:
      Variables:
        NODE_ENV: !Ref Stage
        DATABASE_URL: !Ref DatabaseUrl
        JWT_SECRET: !Ref JwtSecret
        JWT_EXPIRES_IN: !Ref JwtExpiration
        SENDGRID_API_KEY: !Ref SendgridApiKey
        REFRESH_TOKEN_SECRET: !Ref RefreshTokenSecret
        TOKEN_EXPIRE: !Ref TokenExpire
        REFRESH_TOKEN_EXPIRE: !Ref RefreshTokenExpire
        TWILIO_ACCOUNT_SID: !Ref TwilioAccountSID
        TWILIO_AUTH_TOKEN: !Ref TwilioAuthToken
        TWILIO_PHONE_NUMBER: !Ref TwilioPhoneNumber
        FROM_EMAIL: !Ref FromEmail
        FROM_NAME: !Ref FromName
        FRONTEND_URL: !Ref FrontendUrl
        DB_HOST: !Ref DatabaseHost
        DB_PORT: !Ref DatabasePort
        DB_USER: !Ref DatabaseUser
        DB_PASSWORD: !Ref DatabasePassword
        DB_NAME: !Ref DatabaseName
        DB_SCHEMA: !Ref DatabaseSchema
        AWS_S3_BUCKET_NAME: buildxup-images
        TEST_EMAIL: !Ref TestEmail
        DEPLOYMENT_TIMESTAMP: !Ref DeploymentTimestamp

Resources:
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      StageName: dev   # Hard-coded stage name
      EndpointConfiguration: REGIONAL
      BinaryMediaTypes:
        - "*/*"
      Cors:
        AllowMethods: "'*'"
        AllowHeaders: "'*'"
        AllowOrigin: "'*'"

  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: 530061243896.dkr.ecr.us-east-1.amazonaws.com/stage/buildxup/backend:latest
      ImageConfig:
        Command: ["dist/module_auth.handler"]
      Role: arn:aws:iam::530061243896:role/Lambda_Execution_Role
      Events:
        AuthApi:
          Type: Api
          Properties:
            Path: /auth/{proxy+}
            Method: any
            RestApiId: !Ref ApiGateway

  TaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: 530061243896.dkr.ecr.us-east-1.amazonaws.com/stage/buildxup/backend:latest
      ImageConfig:
        Command: ["dist/module_task.handler"]
      Role: arn:aws:iam::530061243896:role/Lambda_Execution_Role
      Events:
        TaskApi:
          Type: Api
          Properties:
            Path: /tasks/{proxy+}
            Method: any
            RestApiId: !Ref ApiGateway

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: 530061243896.dkr.ecr.us-east-1.amazonaws.com/stage/buildxup/backend:latest
      ImageConfig:
        Command: ["dist/ping.handler"]
      Role: arn:aws:iam::530061243896:role/Lambda_Execution_Role
      Events:
        Ping:
          Type: Api
          Properties:
            Path: /server/ping
            Method: get
            RestApiId: !Ref ApiGateway
        PingDb:
          Type: Api
          Properties:
            Path: /server/ping-db
            Method: get
            RestApiId: !Ref ApiGateway

  ProjectFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: 530061243896.dkr.ecr.us-east-1.amazonaws.com/stage/buildxup/backend:latest
      ImageConfig:
        Command: ["dist/module_project.handler"]
      Role: arn:aws:iam::530061243896:role/Lambda_Execution_Role
      Events:
        ProjectApi:
          Type: Api
          Properties:
            Path: /projects/{proxy+}
            Method: any
            RestApiId: !Ref ApiGateway

  EmployeeFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: 530061243896.dkr.ecr.us-east-1.amazonaws.com/stage/buildxup/backend:latest
      ImageConfig:
        Command: ["dist/module_employee.handler"]
      Role: arn:aws:iam::530061243896:role/Lambda_Execution_Role
      Events:
        EmployeeApi:
          Type: Api
          Properties:
            Path: /employees/{proxy+}
            Method: any
            RestApiId: !Ref ApiGateway

Outputs:
  ApiUrl:
    Description: "API Gateway endpoint URL"
    Value:
      Fn::Sub: "https://${ApiGateway}.execute-api.us-east-1.amazonaws.com/dev/"
