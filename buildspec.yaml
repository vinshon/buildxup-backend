version: 0.2

phases:
  pre_build:
    commands:
      - echo "Cleaning previous build artifacts..."
      - rm -rf .aws-sam
      - echo "Installing AWS SAM CLI and Node.js dependencies..."
      - pip install aws-sam-cli
      - npm ci
      # Download your environment file from S3 (adjust path as needed)
      - echo "Downloading .env from S3..."
      - aws s3 cp s3://buildxup-delopyment-stage/backend/.env .env

  build:
    commands:
      - echo "Starting SAM build..."
      - sam build
      - echo "Packaging SAM template..."
      - sam package --template-file .aws-sam/build/template.yaml --s3-bucket buildxup-deployment-artifacts-12345 --output-template-file packaged.yaml

  post_build:
    commands:
      - echo "Deploying SAM application to CloudFormation stack..."
      - sam deploy --template-file packaged.yaml --stack-name buildxup-backend-stage --capabilities CAPABILITY_IAM --no-fail-on-empty-changeset

artifacts:
  files:
    - template.yaml
    - packaged.yaml