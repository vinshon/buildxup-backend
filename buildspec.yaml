version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo "Installing SAM CLI..."
      - pip install aws-sam-cli

  pre_build:
    commands:
      - echo "Pre-build: Handling existing stack..."
      - |
          # Force delete stack if it exists in any problematic state
          STACK_STATUS=$(aws cloudformation describe-stacks --stack-name buildxup-backend-stage --region "$AWS_DEFAULT_REGION" --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo "STACK_NOT_FOUND")
          echo "Current stack status: $STACK_STATUS"
          
          if [[ "$STACK_STATUS" != "STACK_NOT_FOUND" ]]; then
              echo "Stack exists with status: $STACK_STATUS. Deleting stack..."
              aws cloudformation delete-stack --stack-name buildxup-backend-stage --region "$AWS_DEFAULT_REGION"
              echo "Waiting for stack deletion to complete..."
              aws cloudformation wait stack-delete-complete --stack-name buildxup-backend-stage --region "$AWS_DEFAULT_REGION" || true
              echo "Stack deletion completed."
              
              # Wait a bit more to ensure cleanup is complete
              sleep 30
          else
              echo "Stack does not exist. Proceeding with deployment."
          fi

  build:
    commands:
      - echo "Build started on $(date)"

      - echo "Downloading environment file from S3..."
      - aws s3 cp s3://buildxup-delopyment-stage/backend/.env .env

      - echo "Installing source NPM dependencies ..."
      - npm ci

      - echo "Verifying and creating S3 bucket/prefix if necessary..."
      - |
          if aws s3 ls "s3://buildxup-deployment-artifacts-12345" 2>&1 | grep -q 'NoSuchBucket'; then
              aws s3 mb "s3://buildxup-deployment-artifacts-12345" --region "$AWS_DEFAULT_REGION"
          fi

      - echo "Building SAM application with main template..."
      - sam build

      - echo "Validating SAM template..."
      - sam validate

      - echo "Packaging SAM template..."
      - sam package --s3-bucket buildxup-deployment-artifacts-12345 --output-template-file packaged.yaml

      - echo "Build completed on $(date)"

  post_build:
    commands:
      - echo "Deploying SAM application..."
      - |
          # Try deployment with retry logic
          MAX_RETRIES=3
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              echo "Deployment attempt $((RETRY_COUNT + 1)) of $MAX_RETRIES"
              
              if sam deploy --template-file packaged.yaml --stack-name buildxup-backend-stage --capabilities CAPABILITY_IAM --no-fail-on-empty-changeset; then
                  echo "Deployment successful!"
                  break
              else
                  RETRY_COUNT=$((RETRY_COUNT + 1))
                  if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                      echo "Deployment failed. Retrying in 60 seconds..."
                      sleep 60
                  else
                      echo "Main template deployment failed. Trying backup template..."
                      # Try with backup template
                      cp template-backup.yaml template.yaml
                      sam build
                      sam package --s3-bucket buildxup-deployment-artifacts-12345 --output-template-file packaged-backup.yaml
                      sam deploy --template-file packaged-backup.yaml --stack-name buildxup-backend-stage --capabilities CAPABILITY_IAM --no-fail-on-empty-changeset
                  fi
              fi
          done

artifacts:
  files:
    - template.yaml
    - packaged.yaml
    - template-backup.yaml
