version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo "Nothing to do in the install phase"
      - echo "Starting Docker daemon..."
      - nohup /usr/local/bin/dockerd --host=unix:///var/run/docker.sock &
      - timeout 15 sh -c "until docker info; do echo .; sleep 1; done"

  build:
    commands:
      - echo "Build started on $(date)"

      - echo "Downloading environment file from S3..."
      - aws s3 cp "s3://buildxup-delopyment-stage/backend/.env" .

      - echo "Exporting env variables from .env..."
      - export $(cat .env | grep -v '^#' | xargs)
      - export DeploymentTimestamp=$(date +%Y%m%d-%H%M%S)
      - echo "Verifying critical environment variables..."
      - echo "SENDGRID_API_KEY: ${SENDGRID_API_KEY:0:10}..."
      - echo "DeploymentTimestamp: $DeploymentTimestamp"

      - echo "Fetching Dockerfile from S3..."
      - aws s3 cp "s3://buildxup-delopyment-stage/backend/Dockerfile" .
      - echo "Dockerfile contents:"
      - cat Dockerfile

      - echo "Cleaning up any existing Docker images to prevent caching..."
      - docker system prune -f || true
      - docker rmi $(docker images -q 530061243896.dkr.ecr.us-east-1.amazonaws.com/stage/buildxup/backend:latest) 2>/dev/null || true

      - echo "Installing source NPM dependencies..."
      - npm ci

      - echo "Generating Prisma client for all schemas..."
      - npm run prisma:all:generate

      - echo "Running app build to generate dist folder..."
      - export NODE_OPTIONS="--max_old_space_size=4096"
      - npm run build

      - echo "Verifying dist folder contents..."
      - ls -la dist/
      - echo "Checking if module_auth.js was updated..."
      - ls -la dist/module_auth.js
      - echo "File size and timestamp:"
      - stat dist/module_auth.js

      - echo "Verifying and creating S3 bucket/prefix if necessary..."
      - |
        if aws s3 ls "s3://buildxup-delopyment-stage" 2>&1 | grep -q 'NoSuchBucket'; then
          aws s3 mb "s3://buildxup-delopyment-stage" --region "us-east-1"
        fi

      - |
        if ! aws s3 ls "s3://buildxup-delopyment-stage" 2>&1 | grep -q "PRE backend/"; then
          aws s3api put-object --bucket "buildxup-delopyment-stage" --key "backend/"
        fi

      - echo "Preparing Docker image for Lambda..."
      - export ECR_REPO="stage/buildxup/backend"
      - export IMAGE_TAG=$(date +%Y%m%d-%H%M%S)
      - export IMAGE_URI="530061243896.dkr.ecr.us-east-1.amazonaws.com/stage/buildxup/backend:$IMAGE_TAG"

      - echo "Logging into ECR..."
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 530061243896.dkr.ecr.us-east-1.amazonaws.com

      - echo "Building Docker image..."
      - echo "Docker build context contents:"
      - ls -la dist/
      - docker build --no-cache -t $IMAGE_URI .

      - echo "Pushing image to ECR..."
      - docker push $IMAGE_URI

      - echo "Also tagging as latest for template compatibility..."
      - docker tag $IMAGE_URI 530061243896.dkr.ecr.us-east-1.amazonaws.com/stage/buildxup/backend:latest
      - docker push 530061243896.dkr.ecr.us-east-1.amazonaws.com/stage/buildxup/backend:latest

      - echo "Checking template.yaml exists..."
      - ls -la template.yaml

      - echo "Substituting environment variables into SAM template..."
      - envsubst < "template.yaml" > template-processed.yaml

      - echo "Checking processed template exists..."
      - ls -la template-processed.yaml

      - export ECR_REPO_URI="530061243896.dkr.ecr.us-east-1.amazonaws.com/stage/buildxup/backend"

      - echo "Packaging SAM template..."
      - |
        sam package \
          --template-file template-processed.yaml \
          --s3-bucket "buildxup-delopyment-stage" \
          --s3-prefix "backend" \
          --image-repository "$ECR_REPO_URI" \
          --output-template-file "artifact.yaml"

      - echo "Checking artifact.yaml exists..."
      - ls -la artifact.yaml

      - echo "Deploying SAM template..."
      - |
        sam deploy \
          --template-file artifact.yaml \
          --stack-name buildxup-backend \
          --capabilities CAPABILITY_IAM \
          --region us-east-1 \
          --no-fail-on-empty-changeset

      - echo "Build completed on $(date)"

artifacts:
  files:
    - template.yaml
    - template-processed.yaml
    - artifact.yaml
    - dist/**/*
