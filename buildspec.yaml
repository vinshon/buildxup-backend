version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo "Nothing to do in the install phase"

  build:
    commands:
      - echo "Build started on $(date)"

      - echo "Downloading environment file from S3..."
      - aws s3 cp s3://buildxup-delopyment-stage/backend/.env .env

      - echo "Installing source NPM dependencies ..."
      - npm ci

      - echo "Verifying and creating S3 bucket/prefix if necessary..."
      - |
          if aws s3 ls "s3://buildxup-deployment-artifacts-12345" 2>&1 | grep -q 'NoSuchBucket'; then
              aws s3 mb "s3://buildxup-deployment-artifacts-12345" --region "$AWS_DEFAULT_REGION"
          fi

      - echo "Building SAM application..."
      - sam build

      - echo "Packaging SAM template..."
      - sam package --s3-bucket buildxup-deployment-artifacts-12345 --output-template-file packaged.yaml

      - echo "Build completed on $(date)"

  post_build:
    commands:
      - echo "Checking stack status and handling rollback..."
      - |
          STACK_STATUS=$(aws cloudformation describe-stacks --stack-name buildxup-backend-stage --region "$AWS_DEFAULT_REGION" --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo "STACK_NOT_FOUND")
          echo "Current stack status: $STACK_STATUS"
          
          if [[ "$STACK_STATUS" == *"ROLLBACK"* ]] || [[ "$STACK_STATUS" == *"FAILED"* ]]; then
              echo "Stack is in rollback or failed state. Deleting stack..."
              aws cloudformation delete-stack --stack-name buildxup-backend-stage --region "$AWS_DEFAULT_REGION"
              echo "Waiting for stack deletion to complete..."
              aws cloudformation wait stack-delete-complete --stack-name buildxup-backend-stage --region "$AWS_DEFAULT_REGION" || true
              echo "Stack deletion completed."
          elif [[ "$STACK_STATUS" == "STACK_NOT_FOUND" ]]; then
              echo "Stack does not exist. Proceeding with deployment."
          else
              echo "Stack exists and is not in rollback state. Proceeding with update."
          fi
      
      - echo "Deploying SAM application..."
      - sam deploy --template-file packaged.yaml --stack-name buildxup-backend-stage --capabilities CAPABILITY_IAM --no-fail-on-empty-changeset

artifacts:
  files:
    - template.yaml
    - packaged.yaml
